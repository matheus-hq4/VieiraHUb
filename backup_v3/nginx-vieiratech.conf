# Configuração do Nginx para o VieiraTech HUB
# Salvar em: /etc/nginx/sites-available/vieiratech-hub
# Ativar com: sudo ln -s /etc/nginx/sites-available/vieiratech-hub /etc/nginx/sites-enabled/
# Testar com: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name hub.vieiratech.local 10.10.70.70 localhost;

    client_max_body_size 20M;

    # Logs
    access_log /var/log/nginx/vieiratech_hub_access.log;
    error_log /var/log/nginx/vieiratech_hub_error.log;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy para o servidor Node.js (PM2)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bloqueio de acesso direto a arquivos de banco de dados e arquivos ocultos
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ^~ /data/ {
        deny all;
    }
}
